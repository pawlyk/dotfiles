# ============================================================================ #
#                                BASIC SETTINGS                                #
# ============================================================================ #

# True Color support (critical for Neovim and Kanagawa theme)
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

# Mouse: enable scrolling, window selection, and pane resizing
set -g mouse on

# Change prefix: use Ctrl+a instead of the inconvenient Ctrl+b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Number windows and panes starting from 1 (because 0 is too far)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reduce Esc key delay (so Neovim doesn't lag when exiting Insert mode)
set -sg escape-time 10

# Scroll history (more lines)
set -g history-limit 50000

# ============================================================================ #
#                                KEYBINDINGS                                   #
# ============================================================================ #

# Quick config reload (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Convenient splits: | for vertical, - for horizontal
# New panes open in the same directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Shift + arrows
bind -n S-Up resize-pane -U 5
bind -n S-Down resize-pane -D 5
bind -n S-Left resize-pane -L 5
bind -n S-Right resize-pane -R 5

# Vim-style copying (Prefix + [, then v to select, y to copy)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ============================================================================ #
#                                DESIGN (KANAGAWA STYLE)                       #
# ============================================================================ #

# Status bar (background and text)
set -g status-style "bg=#1F1F28,fg=#DCD7BA"

# Inactive windows
set -g window-status-style "fg=#727169,bg=#1F1F28"
set -g window-status-format " #I:#W "

# Active window
set -g window-status-current-style "fg=#C8C093,bg=#2D4F67,bold"
set -g window-status-current-format " #I:#W "

# Pane border colors
set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#7E9CD8"

# ============================================================================ #
#                                PLUGINS (TPM)                                 #
# ============================================================================ #

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Plugin for session persistence after reboot
# Save: Prefix + Ctrl-s | Restore: Prefix + Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (this line MUST ALWAYS be last)
run '~/.tmux/plugins/tpm/tpm'

